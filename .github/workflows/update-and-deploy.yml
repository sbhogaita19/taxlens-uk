name: Update official data & deploy

on:
  schedule:
    - cron: "17 5 * * *"    # every day ~06:17 UK time (05:17 UTC)
    - cron: "17 12 * * 1-5" # plus a lunchtime refresh on weekdays
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest HMRC / GOV.UK / legislation.gov.uk updates
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/fetch-updates.mjs

      - name: Refresh legislation section index (weekly)
        run: node scripts/build-legislation-index.mjs

      - name: Commit data changes
        run: |
          git config user.name "taxlens-bot"
          git config user.email "taxlens-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: official updates $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push failed, retrying ($i)"; git rebase --abort 2>/dev/null || true; sleep 5
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
